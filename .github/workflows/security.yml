name: Security integration
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3-pil python3-fonttools python3-gi clamav minisign meson ninja-build gettext libglib2.0-bin fontconfig
      - name: Permit isolated user namespaces on this disposable runner
        run: |
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Update antivirus definitions
        run: |
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam
      - name: Core checks
        run: |
          /usr/bin/meson setup /tmp/orbits-build
          /usr/bin/meson test -C /tmp/orbits-build --print-errorlogs
      - name: Required live sandbox, signature and malware checks
        env:
          ORBITS_REQUIRE_LIVE_SECURITY: '1'
        run: /usr/bin/python3 -m unittest tests.test_live_security.LiveParserTests tests.test_live_security.LiveSignatureTests tests.test_live_security.LiveMalwareTests
      - name: Required privileged staging checks (temporary paths only)
        run: sudo env ORBITS_REQUIRE_LIVE_SECURITY=1 /usr/bin/python3 -m unittest tests.test_live_security.RootStagingTests
